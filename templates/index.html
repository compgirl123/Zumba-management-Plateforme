<!DOCTYPE html>
<html>

<head>

    <title>My Form</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</head>


<body class="bg-info">


    <div class="text-center p-5">

        <h1>Welcome to Zumba Class</h1>

        <p>
            Please Choose one of the following options
        </p>

    </div>


    <div class="container">


        <h1>Select an option</h1>


        <!-- MAIN DROPDOWN -->

        <select id="mainDropdown">

            <option value="">
                -- Choose an option --
            </option>

            {% for option in options %}

                <option value="{{ option }}">
                    {{ option }}
                </option>

            {% endfor %}

        </select>


        <p>

            Selected option:

            <span id="selectedOption"></span>

        </p>


        <p id="result"></p>



        <!-- ADD PARTICIPANT FORM -->

        <form id="addParticipantForm"
              action="/submit"
              method="POST"
              style="display: none;">


            <h2>Add Participant</h2>


            <!-- AGE -->

            <label for="age">
                Age of new participant:
            </label>

            <input type="text"
                   id="age"
                   name="age">


            <br>
            <br>


            <!-- NAME -->

            <label for="name">
                Name:
            </label>

            <input type="text"
                   id="name"
                   name="name">


            <br>
            <br>


            <!-- DATE OF BIRTH -->

            <label for="birthday">
                Date of Birth:
            </label>

            <input type="date"
                   id="birthday"
                   name="birthday">


            <br>
            <br>


            <!-- GENDER -->

            <label>
                Gender:
            </label>

            <br>


            <input type="radio"
                   id="girl"
                   name="gender"
                   value="girl">

            <label for="girl">
                Girl
            </label>


            <br>


            <input type="radio"
                   id="boy"
                   name="gender"
                   value="boy">

            <label for="boy">
                Boy
            </label>


            <br>


            <input type="radio"
                   id="nonbinary"
                   name="gender"
                   value="non binary">

            <label for="nonbinary">
                Non-binary
            </label>


            <br>
            <br>



            <!-- LEVEL -->

            <label for="levelDropdown">
                Choose a level:
            </label>

            <br>

            <select id="levelDropdown"
                    name="level">

                <option value="">
                    -- Choose a level --
                </option>

                {% for level in levels %}

                    <option value="{{ level }}">
                        {{ level }}
                    </option>

                {% endfor %}

            </select>


            <br>
            <br>



            <!-- DANCE TYPE -->

            <label for="danceTypeDropdown">
                Choose a dance type:
            </label>

            <br>

            <select id="danceTypeDropdown"
                    name="danceType">

                <option value="">
                    -- Choose a dance type --
                </option>

                {% for danceType in danceTypes %}

                    <option value="{{ danceType }}">
                        {{ danceType }}
                    </option>

                {% endfor %}

            </select>


            <br>
            <br>



            <!-- SUBMIT -->

            <button type="submit">
                Submit
            </button>


        </form>


    </div>



    <script>


        // Main dropdown

        const dropdown =
            document.getElementById("mainDropdown");


        // Selected option text

        const selectedOption =
            document.getElementById("selectedOption");


        // Result message

        const result =
            document.getElementById("result");


        // Add participant form

        const addParticipantForm =
            document.getElementById("addParticipantForm");



        // When the user chooses an option

        dropdown.addEventListener("change", function () {


            // Display selected option

            selectedOption.textContent =
                dropdown.value;



            // Send selected option to Flask

            fetch("/select", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    option: dropdown.value

                })

            })


            .then(response => response.json())


            .then(data => {


                // Display Flask message

                result.textContent =
                    data.message;



                // Show Add Participant form

                if (data.show_add_form) {

                    addParticipantForm.style.display =
                        "block";

                }

                else {

                    addParticipantForm.style.display =
                        "none";

                }


            });


        });


    </script>


</body>

</html>
